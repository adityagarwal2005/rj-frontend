    <!-- Branded loading screen, shown inside #root until React mounts and
         replaces it. Inlined so it paints before any JS or CSS bundle has
         downloaded - on a slow phone that used to be a blank white page. It
         fades in after a short delay, so a fast load never flashes it. -->
    <style>
      html, body { margin: 0; background: #fbf6ef; }
      .rt-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #fbf6ef; color: #241610;
        opacity: 0; animation: rt-splash-in 0.4s ease 0.25s forwards;
      }
      .rt-splash-mark {
        width: 64px; height: 64px; border-radius: 999px; display: flex;
        align-items: center; justify-content: center; color: #8f6f39;
        border: 1px solid rgba(198, 161, 91, 0.55);
        background: linear-gradient(135deg, #fbf6ef, #ede0d0);
      }
      .rt-splash-word {
        font: 600 26px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: -0.01em;
      }
      .rt-splash-word span { color: #af8a48; }
      .rt-splash-bar {
        position: relative; width: 120px; height: 1px; overflow: hidden;
        background: rgba(175, 138, 72, 0.2);
      }
      .rt-splash-bar span {
        position: absolute; inset: 0 auto 0 0; width: 40%; background: #af8a48;
        animation: rt-splash-bar 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes rt-splash-in { to { opacity: 1; } }
      @keyframes rt-splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .rt-splash-bar span { animation: none; width: 100%; } }
    </style>
